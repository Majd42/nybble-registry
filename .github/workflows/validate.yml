name: validate

# Validate every format pack and confirm index.json is up to date on any
# change to the registry. Zero dependencies — just Python's stdlib.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate packs + check index.json
        run: python tools/validate.py --check
